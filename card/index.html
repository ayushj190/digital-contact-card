<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayush Joshi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Calendar Scheduling Popup Script & CSS -->
  <link href="https://calendar.google.com/calendar/scheduling-button-script.css" rel="stylesheet">
  <script src="https://calendar.google.com/calendar/scheduling-button-script.js" async></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background-color: #16251b; /* Matte Forest Green */
      color: #e2ebd8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 90%;
      max-width: 440px;
      background: linear-gradient(145deg, #1f3527 0%, #2a4232 100%); /* Forest Green + Olive blend */
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .profile h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .profile p {
      font-size: 0.95rem;
      color: #a3c29e;
      margin-top: 0.4rem;
      margin-bottom: 2rem;
    }

    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      width: 100%;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .btn-booking {
      background: #3e6b4c;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-booking:hover {
      background: #4a7d5a;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="profile">
      <h1>Ayush Joshi</h1>
      <p>Data & AI Professional</p>
    </div>

    <div class="button-group">
      <!-- Email Button -->
      <a href="mailto:ayush@joshi.contact" class="btn">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Email Me
      </a>

      <!-- LinkedIn Button -->
      <a href="https://joshi.contact/in" target="_blank" rel="noopener noreferrer" class="btn">
        <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-1.3.7-1.75 1.4-1.75 1 0 1.35.75 1.35 1.75v4.93h2.79M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.6a1.63 1.63 0 1 0 0 3.26 1.63 1.63 0 0 0 0-3.26z"/></svg>
        LinkedIn
      </a>

      <!-- GitHub Button -->
      <a href="https://github.com/ayushj190" target="_blank" rel="noopener noreferrer" class="btn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        GitHub
      </a>

      <!-- Google Calendar Booking Button (Triggers Popup Modal with fallback) -->
      <a href="https://calendar.app.google/gBPz8Zd4nR9Z9WCu7" id="book-btn" target="_blank" rel="noopener noreferrer" class="btn btn-booking">
        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
        Book a Meeting
      </a>
    </div>
  </div>

  <script>
    // Initialize Google Calendar Popup Modal
    document.addEventListener("DOMContentLoaded", function() {
      const bookBtn = document.getElementById("book-btn");
      bookBtn.addEventListener("click", function(e) {
        if (window.calendar && window.calendar.schedulingButton) {
          e.preventDefault();
          window.calendar.schedulingButton.load({
            url: "https://calendar.app.google/gBPz8Zd4nR9Z9WCu7"
          });
        }
        // If script hasn't loaded or fails, falls back gracefully to opening target link in new tab
      });
    });
  </script>
</body>
</html>
